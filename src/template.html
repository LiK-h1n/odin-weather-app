<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atmosphere</title>
  </head>
  <body class="theme-default">
    <div class="app-wrapper">
      <header class="controls-section">
        <form id="search-form">
          <input
            type="text"
            id="location-input"
            placeholder="Enter a city..."
            required
            autocomplete="off"
          />
          <button type="submit">Search</button>
        </form>
        <button id="unit-toggle" class="secondary-btn">°F / °C</button>
      </header>
      <div id="error-box" class="error-container hidden">
        <span class="error-icon">⚠️</span>
        <p id="error-text">Location not found. Please try again.</p>
      </div>
      <div id="loading-spinner" class="spinner hidden"></div>
      <main id="weather-dashboard" class="dashboard hidden">
        <section class="current-weather">
          <div class="current-header">
            <h1 id="loc-name">--</h1>
            <div class="current-main">
              <img
                id="current-icon"
                src="#"
                alt=""
                class="weather-icon-large"
              />
              <h2 id="current-temp">--°</h2>
            </div>
            <p id="current-conditions" class="conditions-text">--</p>
          </div>

          <div class="current-details-grid">
            <div class="detail-card">
              <span>High/Low</span>
              <strong id="current-hi-lo">--° / --°</strong>
            </div>
            <div class="detail-card">
              <span>Feels Like</span>
              <strong id="current-feels-like">--°</strong>
            </div>
            <div class="detail-card">
              <span>Humidity</span>
              <strong id="current-humidity">--%</strong>
            </div>
            <div class="detail-card">
              <span>Precipitation</span>
              <strong id="current-precip">--%</strong>
            </div>
            <div class="detail-card">
              <span>Wind</span>
              <strong id="current-wind">-- mph</strong>
            </div>
          </div>
        </section>
        <section class="gif-section">
          <h3>Weather Mood</h3>
          <img id="weather-gif" src="#" alt="Weather GIF" class="mood-gif" />
        </section>
        <section class="weekly-forecast">
          <h3>7-Day Forecast</h3>
          <div id="forecast-grid" class="forecast-grid"></div>
        </section>
      </main>
    </div>
  </body>
</html>
